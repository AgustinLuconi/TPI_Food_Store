# Despliegue completo de Food Store: cuatro servicios. SOLO Nginx publica un puerto; la base y la API quedan en la
# red interna.
#
#   cp .env.example .env
#   docker compose up -d --build
#   # App: http://localhost · Documentación de la API: http://localhost/docs
#
# (Para desarrollar sin Docker se usa docker-compose.dev.yml, que solo levanta la base.)
name: foodstore

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodstore}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD (copiá .env.example a .env)}"
      POSTGRES_DB: ${POSTGRES_DB:-foodstore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodstore}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-foodstore}
      SECRET_KEY: "${SECRET_KEY:?Falta SECRET_KEY (copiá .env.example a .env)}"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost"]}'
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/config/estado-local')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    volumes:
      - web:/out
    restart: "no"

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - web:/usr/share/nginx/html:ro
      - media:/usr/share/nginx/media:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  media:
  web:
