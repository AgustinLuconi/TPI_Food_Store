[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/seed.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends(...) en argumentos por defecto es el patrón de FastAPI

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001", "UP007", "UP035"]
