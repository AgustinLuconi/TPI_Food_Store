# Único punto de entrada de la aplicación (puerto 80): sirve la SPA y las imágenes, y enruta la API al backend.
# Se cubren los cuatro puntos que el plan de trabajo exige: /openapi.json, client_max_body_size, X-Forwarded-For y
# la SPA compilada con VITE_API_URL=/api/v1.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 2. Las imágenes de producto pueden pesar hasta 2 MB (más el envoltorio multipart). El valor por defecto de
    #    Nginx (1 MB) rechazaría imágenes válidas con un 413 antes de llegar a la API.
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # La API.
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 3. La IP real del cliente para el límite de intentos de login. Se SOBRESCRIBE (no se agrega a lo que
        #    mande el cliente): así no se puede falsear para esquivar el límite.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. La documentación interactiva: /docs carga /openapi.json desde la raíz; si este no se enruta al backend,
    #    /docs aparece en blanco.
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes de productos (volumen compartido con el backend, de solo lectura).
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Archivos compilados con hash en el nombre: cacheables para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # La SPA: cualquier ruta que no sea un archivo cae en index.html y la resuelve el router del navegador.
    location / {
        try_files $uri /index.html;
    }
}
