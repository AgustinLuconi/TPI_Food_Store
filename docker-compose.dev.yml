# Base de datos para DESARROLLO. El despliegue completo (db + backend + frontend + nginx)
# vive en docker-compose.yml (Fase 3).
services:
  db:
    image: postgres:16-alpine
    container_name: foodstore-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodstore}
      POSTGRES_DB: ${POSTGRES_DB:-foodstore}
    ports:
      # 5434 en el host: 5432 suele estar ocupado por un Postgres local.
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - foodstore_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  foodstore_pgdata_dev:
